}
#cicle2{
transform: translateX(80px);
}

    animation-iteration-count: 1;

    z-index: 20;

    0%{

    }

}

    0%{

    }

    100%{

    }

}

    100%{
        transform: translate(700px,900px) rotate(0deg);

}

    0%{
        transform: translate(-2300px, 900px);
    }

    100%{
        transform: translate(700px, 900px);
    }

}

   0%{

        color: red;

        opacity: .40;
        color: blue;
        transform: translateY(0);
